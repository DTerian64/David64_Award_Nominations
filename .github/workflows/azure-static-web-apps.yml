name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main     # → production    (award-nomination-frontend)
      - sandbox  # → sandbox       (award-nomination-frontend-sandbox)
      - dev      # → development   (award-nomination-frontend-dev)
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Selects the GitHub Environment, which determines which set of secrets/vars is injected.
    # main   → production  |  sandbox → sandbox  |  dev → development
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'sandbox' && 'sandbox' || 'development' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # Build explicitly so we control the Node version, env vars, and output.
      # Oryx auto-build is skipped (skip_app_build: true) to avoid it serving
      # the raw source instead of the compiled dist/.
      # VITE_* are baked into the bundle at build time via import.meta.env.VITE_*.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_CLIENT_ID: ${{ vars.VITE_CLIENT_ID }}
          VITE_TENANT_ID: ${{ vars.VITE_TENANT_ID }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_CLIENT_ID: ${{ vars.VITE_API_CLIENT_ID }}
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ vars.VITE_APPINSIGHTS_CONNECTION_STRING }}
          VITE_DEMO_ALLOWED_EMAILS: ${{ vars.VITE_DEMO_ALLOWED_EMAILS }}
          VITE_DEMO_AAD_TENANT_ID: ${{ vars.VITE_DEMO_AAD_TENANT_ID }}

      # Deploy with the SWA CLI (pure Node on the runner). This avoids the
      # containerized Azure/static-web-apps-deploy action, whose Dockerfile pulls
      # FROM mcr.microsoft.com/appsvc/staticappsclient — the anonymous MCR token
      # request that intermittently 429/401s. The CLI pulls from npm instead.
      # Same deployment token, same pre-built dist, same target Static Web App.
      - name: Deploy to Azure Static Web Apps (CLI — no MCR image pull)
        run: |
          npx --yes @azure/static-web-apps-cli deploy ./frontend/dist \
            --deployment-token "$SWA_DEPLOY_TOKEN" \
            --env production
        env:
          SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
