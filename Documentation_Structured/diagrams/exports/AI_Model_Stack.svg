<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="490" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f3b57">Five AI/ML models, one risk verdict</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#64748b">Defense-in-depth: complementary techniques screen every award, then fuse into a single reviewable score</text>

  <!-- Left column: five model layers -->
  <!-- Layer 1 -->
  <rect x="40" y="92" width="300" height="60" rx="10" fill="#64748b"/>
  <circle cx="70" cy="122" r="15" fill="#ffffff"/><text x="70" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">1</text>
  <text x="98" y="117" font-size="15" font-weight="bold" fill="#ffffff">Rules</text>
  <text x="98" y="137" font-size="11" fill="#e5e7eb">Frequency, repeat, rushed, outliers</text>

  <!-- Layer 2 -->
  <rect x="40" y="164" width="300" height="60" rx="10" fill="#1168bd"/>
  <circle cx="70" cy="194" r="15" fill="#ffffff"/><text x="70" y="199" text-anchor="middle" font-size="15" font-weight="bold" fill="#1168bd">2</text>
  <text x="98" y="189" font-size="15" font-weight="bold" fill="#ffffff">Supervised ML · Random Forest</text>
  <text x="98" y="209" font-size="11" fill="#e5e7eb">Per-tenant, 20+ features</text>

  <!-- Layer 3 -->
  <rect x="40" y="236" width="300" height="60" rx="10" fill="#0e7490"/>
  <circle cx="70" cy="266" r="15" fill="#ffffff"/><text x="70" y="271" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">3</text>
  <text x="98" y="261" font-size="15" font-weight="bold" fill="#ffffff">Unsupervised · Isolation Forest</text>
  <text x="98" y="281" font-size="11" fill="#e5e7eb">Anomalies with no prior examples</text>

  <!-- Layer 4 -->
  <rect x="40" y="308" width="300" height="60" rx="10" fill="#6d28d9"/>
  <circle cx="70" cy="338" r="15" fill="#ffffff"/><text x="70" y="343" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">4</text>
  <text x="98" y="333" font-size="15" font-weight="bold" fill="#ffffff">Graph analytics</text>
  <text x="98" y="353" font-size="11" fill="#e5e7eb">7 collusion patterns: rings, pairs…</text>

  <!-- Layer 5 -->
  <rect x="40" y="380" width="300" height="60" rx="10" fill="#047857"/>
  <circle cx="70" cy="410" r="15" fill="#ffffff"/><text x="70" y="415" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">5</text>
  <text x="98" y="405" font-size="15" font-weight="bold" fill="#ffffff">Language / NLP · embeddings</text>
  <text x="98" y="425" font-size="11" fill="#e5e7eb">Copy-paste &amp; quid-pro-quo text</text>

  <!-- Fan-in lines to fusion -->
  <line x1="340" y1="122" x2="520" y2="252" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="194" x2="520" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="266" x2="520" y2="288" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="338" x2="520" y2="306" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="410" x2="520" y2="324" stroke="#94a3b8" stroke-width="2"/>

  <!-- Fusion node -->
  <rect x="520" y="248" width="150" height="80" rx="12" fill="#1f3b57"/>
  <text x="595" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Risk fusion</text>
  <text x="595" y="302" text-anchor="middle" font-size="12" fill="#cbd5e1">score 0–100</text>

  <!-- Fusion to verdict arrow -->
  <line x1="670" y1="288" x2="734" y2="288" stroke="#1f3b57" stroke-width="2.5"/>
  <polygon points="742,288 732,283 732,293" fill="#1f3b57"/>

  <!-- Verdict box -->
  <rect x="742" y="212" width="210" height="152" rx="12" fill="#ffffff" stroke="#1f3b57" stroke-width="1.5"/>
  <text x="847" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3b57">Automated action</text>
  <circle cx="770" cy="266" r="7" fill="#dc2626"/><text x="786" y="271" font-size="12.5" fill="#111827">Block — critical risk</text>
  <circle cx="770" cy="298" r="7" fill="#d97706"/><text x="786" y="303" font-size="12.5" fill="#111827">HR review — elevated</text>
  <circle cx="770" cy="330" r="7" fill="#16a34a"/><text x="786" y="335" font-size="12.5" fill="#111827">Approve — clear</text>

  <!-- Footer caption -->
  <line x1="40" y1="486" x2="940" y2="486" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="512" text-anchor="middle" font-size="13" fill="#334155">Per-tenant models · automatically retrained · explainable · human-in-the-loop</text>
  <text x="490" y="534" text-anchor="middle" font-size="11.5" fill="#64748b">Scores both nominator behavior and approver behavior · works from day one, no labeled history required</text>
</svg>
