[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "integrity-engine-core"
version = "0.1.0"
description = "Deterministic integrity scoring shared by training, inference, and ELCE"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

