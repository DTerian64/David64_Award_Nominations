<svg viewBox="0 0 800 740" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Manager approval workflow</title>
  <desc>How a manager's approve/reject flows through the backend API, Service Bus, the auxiliary worker (nominator + new beneficiary email), and the lazy-cached award certificate service.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="740" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Manager Approval Workflow</text>
  <text x="400" y="46" font-size="10" fill="#64748b" text-anchor="middle">Approve / reject → notifications → award certificate&#160;&#160;·&#160;&#160;default OFF, opt-in per tenant</text>

  <!-- ── Layer labels + dividers ── -->
  <text x="40" y="74" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#64748b">MANAGER ENTRY</text>
  <line x1="40" y1="80" x2="760" y2="80" stroke="#1e293b" stroke-width="1"/>

  <text x="40" y="160" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#64748b">BACKEND API</text>
  <line x1="40" y1="166" x2="760" y2="166" stroke="#1e293b" stroke-width="1"/>

  <text x="40" y="266" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#64748b">MESSAGING</text>
  <line x1="40" y1="272" x2="760" y2="272" stroke="#1e293b" stroke-width="1"/>

  <text x="40" y="364" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#64748b">AUXILIARY WORKER</text>
  <line x1="40" y1="370" x2="760" y2="370" stroke="#1e293b" stroke-width="1"/>

  <text x="40" y="576" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#64748b">CERTIFICATE SERVICE</text>
  <line x1="40" y1="582" x2="760" y2="582" stroke="#1e293b" stroke-width="1"/>

  <!-- ── 1. ENTRY ── -->
  <rect x="110" y="92" width="230" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="225" y="116" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">Email action button</text>
  <text x="225" y="133" font-size="9.5" fill="#94a3b8" text-anchor="middle">GET /api/nominations/email-action</text>

  <rect x="430" y="92" width="250" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="555" y="116" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">My Approvals tab&#160;&#160;&#9662;</text>
  <text x="555" y="133" font-size="9.5" fill="#94a3b8" text-anchor="middle">dropdown: Pending&#160;·&#160;Approved / Rejected</text>

  <!-- entry arrows into approve -->
  <line x1="225" y1="148" x2="282" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="505" y1="148" x2="345" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── 2. API ── -->
  <rect x="150" y="172" width="300" height="58" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="300" y="196" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">POST /api/nominations/approve</text>
  <text x="300" y="214" font-size="9.5" fill="#60a5fa" text-anchor="middle">approve_nomination()&#160;·&#160;reject_nomination()</text>

  <!-- read endpoint note (right) -->
  <text x="640" y="190" font-size="9" fill="#475569" text-anchor="middle" font-style="italic">decided list:</text>
  <text x="640" y="203" font-size="9" fill="#475569" text-anchor="middle" font-style="italic">GET …/my-approvals</text>

  <!-- API -> bus -->
  <line x1="300" y1="230" x2="360" y2="278" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── 3. MESSAGING ── -->
  <rect x="180" y="280" width="360" height="54" rx="8" fill="#2a1e4d" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="360" y="303" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle">Azure Service Bus — nomination.approved</text>
  <text x="360" y="321" font-size="9.5" fill="#a78bfa" text-anchor="middle">published on approve &amp; reject&#160;·&#160;idempotent (ProcessedEvents)</text>

  <line x1="360" y1="334" x2="360" y2="376" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-violet)"/>

  <!-- ── 4. AUX WORKER ── -->
  <rect x="210" y="378" width="300" height="54" rx="8" fill="#14291f" stroke="#10b981" stroke-width="1.5"/>
  <text x="360" y="401" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">nomination_approved.handle</text>
  <text x="360" y="419" font-size="9.5" fill="#4ade80" text-anchor="middle">reads Status → Approved / Paid&#160;vs&#160;Rejected</text>

  <!-- branch arrows -->
  <line x1="300" y1="432" x2="200" y2="476" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="420" y1="432" x2="555" y2="476" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="240" y="458" font-size="9" fill="#10b981" font-style="italic" text-anchor="middle">all outcomes</text>
  <text x="505" y="458" font-size="9" fill="#10b981" font-style="italic" text-anchor="middle">Approved / Paid</text>

  <!-- nominator email -->
  <rect x="70" y="478" width="250" height="60" rx="8" fill="#14291f" stroke="#10b981" stroke-width="1.5"/>
  <text x="195" y="501" font-size="10.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">Email NOMINATOR</text>
  <text x="195" y="518" font-size="9.5" fill="#4ade80" text-anchor="middle">congratulations (approved)</text>
  <text x="195" y="531" font-size="9.5" fill="#4ade80" text-anchor="middle">polite decline (rejected)</text>

  <!-- beneficiary email (NEW) -->
  <rect x="410" y="478" width="300" height="60" rx="8" fill="#143027" stroke="#34d399" stroke-width="2"/>
  <rect x="624" y="470" width="70" height="18" rx="9" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="659" y="483" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">★ NEW</text>
  <text x="560" y="501" font-size="10.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">Email BENEFICIARY</text>
  <text x="560" y="518" font-size="9.5" fill="#6ee7b7" text-anchor="middle">approved / paid only&#160;·&#160;shows amount</text>
  <text x="560" y="531" font-size="9.5" fill="#6ee7b7" text-anchor="middle">+ payout_submit on the same event</text>

  <!-- ── 5. CERTIFICATE ── -->
  <!-- template blob (left) -->
  <rect x="80" y="592" width="300" height="56" rx="8" fill="#2e2410" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="230" y="616" font-size="10.5" font-weight="700" fill="#fcd34d" text-anchor="middle">certificate-templates (blob)</text>
  <text x="230" y="633" font-size="9.5" fill="#fbbf24" text-anchor="middle">reportlab overlay name/award/date → store PDF</text>

  <!-- get_or_create (right) -->
  <rect x="420" y="592" width="300" height="56" rx="8" fill="#2e2410" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="570" y="616" font-size="10.5" font-weight="700" fill="#fcd34d" text-anchor="middle">get_or_create_certificate(id)</text>
  <text x="570" y="633" font-size="9.5" fill="#fbbf24" text-anchor="middle">blob exists?&#160;&#160;reuse cached&#160;:&#160;build</text>

  <!-- build-if-not-cached arrow -->
  <line x1="420" y1="620" x2="384" y2="620" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="402" y="612" font-size="8.5" fill="#fbbf24" text-anchor="middle" font-style="italic">build</text>

  <!-- attach path from beneficiary -->
  <path d="M560,538 L560,560 L570,560 L570,592" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
  <text x="660" y="566" font-size="9" fill="#fbbf24" text-anchor="middle" font-style="italic">if attach_to_beneficiary</text>

  <!-- certificate link from My Approvals (far-right route) -->
  <path d="M640,148 L735,148 L735,612 L722,612" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,3" marker-end="url(#arr)"/>
  <text x="700" y="300" font-size="9" fill="#94a3b8" text-anchor="middle" font-style="italic" transform="rotate(90 700 300)">Certificate link · GET …/{id}/certificate</text>

  <!-- returns pill -->
  <rect x="470" y="678" width="260" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="600" y="697" font-size="9.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">Returns PDF — stream / SAS&#160;·&#160;manager presents</text>
  <line x1="570" y1="648" x2="600" y2="678" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>
</svg>
